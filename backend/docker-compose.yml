services:
  postgres:
    image: postgres:15
    container_name: pookiestudios-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pookiestudios
    volumes:
      - pookiestudios_postgres_data:/var/lib/postgresql/data

volumes:
  pookiestudios_postgres_data:
